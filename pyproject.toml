[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kreg"
version = "0.4.1"
description = "Kernel regression with Kronecker-structured priors"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "IHME Math Sciences", email = "ihme.math.sciences@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Natural Language :: English",
]
dependencies = [
    "jax>=0.4.35",
    "numpy>=1.26",
    "pandas>=2.2",
    "matfree>=0.1.0",
    "msca>=0.2.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
docs = ["sphinx", "sphinx-autodoc-typehints", "furo"]

[project.urls]
github = "https://github.com/ihmeuw-msca/kreg"
